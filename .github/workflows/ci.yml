# CI runs at milestones, not on every push or PR (see CLAUDE.md, "CI").
# Unit tests run locally on every PR; this is the release gate.
name: CI

on:
  milestone:
    types: [closed]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobradar
          POSTGRES_PASSWORD: jobradar
          POSTGRES_DB: jobradar
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobradar"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://jobradar:jobradar@localhost:5432/jobradar
      TEST_DATABASE_URL: postgresql+psycopg://jobradar:jobradar@localhost:5432/jobradar_test
      REQUIRE_DATABASE: "1"
      TEST_REDIS_URL: redis://localhost:6379/0
      REQUIRE_REDIS: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - name: Migrations apply to a fresh database
        run: alembic upgrade head && alembic check
      - name: Create the test database
        run: psql "postgresql://jobradar:jobradar@localhost:5432/jobradar" -c "CREATE DATABASE jobradar_test"
      - name: Tests (database and Redis tests must run, not skip)
        run: pytest -q -rs --cov=job_radar --cov-report=term

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build every image
        run: |
          cp .env.example .env
          docker compose build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 detect --no-banner --source /repo --redact
